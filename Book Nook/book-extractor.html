    <div class="container-fluid px-5">
      <div class="row">
        <div class="col-sm-2"></div>
        <div class="col-sm-8">
          <h5>Book Title Extractor</h5>
          <p>Upload multiple book cover images to extract their titles:</p>
          <div class="d-flex gap-5">
            <input class="form-control" id="imageInput" type="file" accept="image/*" multiple />
            <button class="btn btn-outline-danger btn-sm d-none" id="btnClear">Clear</button>
          </div>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-sm-2"></div>
        <div class="col-sm-8">
          <!-- <div class="loader-container d-flex justify-content-center p-5 mt-5">
            <div class="loader"></div>
          </div> -->
          <div id="output" class="output-container p-1 d-none">
            <table class="table">
              <thead>
                <tr>
                  <th>Image Preview</th>
                  <th>Extracted Title</th>
                </tr>
              </thead>
              <tbody id="resultsTable">
                <!-- Extracted results will appear here -->

<script src="./js/script.js"></script>
