<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlexLibrary - Add New Book</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/overwrite.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.js"></script>
    <link
      type="text/css"
      rel="stylesheet"
      href="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.css"
    />
    <script src="./js/config.js"></script>
    <script type="module" src="./js/index.js"></script>
    <script src="./js/script.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html"
          ><img src="./assets/logo.png" class="img-fluid"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarTogglerDemo02"
          aria-controls="navbarTogglerDemo02"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse text-end" id="navbarTogglerDemo02">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Book Search</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="book-list.html">Added Books</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="create-Book.html">Create Book</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="book-extractor.html">Books Extractor</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="book-request.html">Books request</a>
            </li>
            <li class="nav-item">
              <button id="google-sign-in-btn" class="btn btn-danger">
                Sign in with Google
              </button>
            </li>

            <!-- User info section, initially hidden -->
            <li class="nav-item" id="user-info-container" style="display: none">
              <img id="user-photo" width="30" height="30" alt="User Photo" />
              <span id="user-name"></span>
              <button id="sign-out-btn" class="btn btn-warning">
                Sign Out
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container-fluid px-5">
      <div class="row">
        <h5>Add a New Book</h5>
        <p>Fill in the details below to add a new book to the collection:</p>
      </div>
      <div class="row">
        <div class="col-sm-2"></div>
        <div class="col-sm-8">
          <div class="row px-md-5">
            <div class="col-sm-1"></div>
            <form id="bookForm" class="col-sm-10 p-5 rounded-4 bg-light">
              <div class="form-floating mb-4">
                <input
                  type="text"
                  class="form-control"
                  id="title"
                  required
                  placeholder=""
                />
                <label for="title">Title</label>
              </div>
              <div class="form-floating mb-4">
                <input
                  type="text"
                  class="form-control"
                  id="author"
                  placeholder=""
                />
                <label for="author">Author</label>
              </div>
              <div class="form-floating mb-4">
                <input
                  type="number"
                  class="form-control"
                  id="pageCount"
                  placeholder=""
                />
                <label for="pageCount">Page Count</label>
              </div>
              <div class="form-floating mb-4">
                <input
                  type="file"
                  id="imageInput"
                  class="form-control"
                  accept="image/*"
                  placeholder=""
                />
                <label for="imageInput">Upload Image</label>
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100">
                Submit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression"></script>
    <script src="./js/script.js"></script>
    <script src="create-Book.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
